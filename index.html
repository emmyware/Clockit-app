<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#9333ea">
    <meta name="description" content="Clock It - Capture your moments, one at a time">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Clock It - Photo Journal</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div id="app">
        <!-- Home View -->
        <div id="home-view" class="view active">
            <div class="gradient-bg">
                <div class="logo-section">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <h1 class="app-title">Clock It</h1>
                    <p class="app-subtitle">Capture your moments, one at a time</p>
                </div>

                <div class="card main-card">
                    <div class="card-header">
                        <h2 id="capture-status">Capture Today's Moment</h2>
                        <p id="frequency-display">Daily capture mode</p>
                    </div>

                    <button id="capture-btn" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        Take Photo
                    </button>
                    <input type="file" id="photo-input" accept="image/*" capture="environment" style="display: none;">

                    <div class="stats-grid">
                        <div class="stat-card purple">
                            <div class="stat-value" id="total-moments">0</div>
                            <div class="stat-label">Total Moments</div>
                        </div>
                        <div class="stat-card pink">
                            <div class="stat-value" id="month-moments">0</div>
                            <div class="stat-label">This Month</div>
                        </div>
                        <div class="stat-card orange">
                            <div class="stat-value" id="year-moments">0</div>
                            <div class="stat-label">This Year</div>
                        </div>
                    </div>
                </div>

                <div class="nav-buttons">
                    <button class="nav-btn" onclick="showView('gallery')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Gallery
                    </button>
                    <button class="nav-btn" onclick="showView('compile')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        Compile
                    </button>
                    <button class="nav-btn" onclick="toggleSettings()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 1v6m0 6v6m9-9h-6M7 12H1m15.364-6.364l-4.243 4.243M8.879 15.121l-4.243 4.243m12.728 0l-4.243-4.243M8.879 8.879L4.636 4.636"></path>
                        </svg>
                        Settings
                    </button>
                </div>

                <div id="settings-panel" class="settings-panel hidden">
                    <div class="card">
                        <h3>Settings</h3>
                        <label class="setting-label">Reminder Frequency</label>
                        <select id="frequency-select" class="select-input">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                        <button class="btn-secondary" onclick="toggleSettings()">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gallery View -->
        <div id="gallery-view" class="view">
            <div class="view-container">
                <div class="view-header">
                    <h2>Your Moments</h2>
                    <button class="btn-back" onclick="showView('home')">← Back</button>
                </div>
                <div id="gallery-grid" class="gallery-grid">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <p>No moments captured yet</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Compile View -->
        <div id="compile-view" class="view">
            <div class="view-container">
                <div class="view-header">
                    <h2>Compile & Share</h2>
                    <button class="btn-back" onclick="showView('home')">← Back</button>
                </div>

                <div class="card">
                    <h3>Monthly Compilation</h3>
                    <div class="select-row">
                        <select id="month-select" class="select-input">
                            <option value="0">January</option>
                            <option value="1">February</option>
                            <option value="2">March</option>
                            <option value="3">April</option>
                            <option value="4">May</option>
                            <option value="5">June</option>
                            <option value="6">July</option>
                            <option value="7">August</option>
                            <option value="8">September</option>
                            <option value="9">October</option>
                            <option value="10">November</option>
                            <option value="11">December</option>
                        </select>
                        <select id="year-select-monthly" class="select-input">
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                        </select>
                    </div>
                    <p id="monthly-count" class="photo-count">0 photos</p>
                    <div id="monthly-preview" class="preview-grid"></div>
                    <button id="generate-monthly" class="btn-primary" onclick="generateMonthlyCollage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Generate Monthly Collage
                    </button>
                </div>

                <div class="card">
                    <h3>Yearly Compilation</h3>
                    <select id="year-select-yearly" class="select-input">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                    <p id="yearly-count" class="photo-count">0 photos</p>
                    <div id="yearly-preview" class="preview-grid"></div>
                    <button id="generate-yearly" class="btn-primary orange-gradient" onclick="generateYearlyCollage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Generate Yearly Collage
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
